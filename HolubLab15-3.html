<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 3</title>
</head>
<body>
<script>
let numb = 10000;
let result = numb;
let counter = 0;

while (result >= 50) {
    result /= 2;
    counter++;
}

document.write(result + "<br>");
document.write(counter);
console.log(result);
console.log(counter);
</script>
</body>
