<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 4</title>
</head>
<body>
<script>
let month = Number(prompt("Введіть номер місяця від 1 до 12:"));
let season;
let name;

switch (month) {
    case 12: case 1: case 2:
        season = "зима";
        break;
    case 3: case 4: case 5:
        season = "весна";
        break;
    case 6: case 7: case 8:
        season = "літо";
        break;
    case 9: case 10: case 11:
        season = "осінь";
        break;
}

let months = ["січень", "лютий", "березень", "квітень", "травень", "червень", "липень", "серпень", "вересень", "жовтень", "листопад", "грудень"];
name = months[month - 1];

alert("Пора року: " + season + "\nМісяць: " + name);
</script>
</body>
</html>
