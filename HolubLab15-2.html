<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2</title>
</head>
<body>
<script>
let number = 0;

do {
    if (number === 0) {
        document.write(number + " – це нуль<br>");
    } else if (number % 2 === 0) {
        document.write(number + " – парне число<br>");
    } else {
        document.write(number + " – непарне число<br>");
    }
    number++;
} while (number <= 10);
</script>
</body>
</html>
